[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log

[program:myapp_gunicorn]
command=gunicorn --bind 0.0.0.0:5000 app:app --log-level=debug --workers=2 --reload
directory=/usr/src/app/server
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/flask.err.log
stdout_logfile=/var/log/supervisor/flask.out.log