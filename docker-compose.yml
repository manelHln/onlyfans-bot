services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
    
  chrome:
    image: selenium/node-chrome:beta
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_ENABLE_TRACING=true
      - SE_OTEL_TRACES_EXPORTER=otlp
      - SE_OTEL_EXPORTER_ENDPOINT=http://jaeger:4317

  selenium-hub:
    image: selenium/hub:latest
    container_name: selenium-hub
    depends_on:
      - jaeger
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    environment:
      # - SE_START_VNC=false=false
      - SE_ENABLE_TRACING=false
      - SE_OTEL_TRACES_EXPORTER=otlp
      - SE_OTEL_EXPORTER_ENDPOINT=http://jaeger:4317

  # chrome_video:
  #   image: selenium/video:ffmpeg-7.1-20241204
  #   depends_on:
  #     - chrome
  #   environment:
  #     - DISPLAY_CONTAINER_NAME=chrome
  #     - SE_VIDEO_FILE_NAME=auto
  #     - SE_VIDEO_UPLOAD_ENABLED=true
  #     - SE_UPLOAD_DESTINATION_PREFIX=s3://mybucket/path
  #     - RCLONE_CONFIG_S3_TYPE=s3
  #     - RCLONE_CONFIG_S3_PROVIDER=GCS
  #     - RCLONE_CONFIG_S3_ENV_AUTH=true
  #     - RCLONE_CONFIG_S3_REGION=asia-southeast1
  #     - RCLONE_CONFIG_S3_LOCATION_CONSTRAINT=asia-southeast1
  #     - RCLONE_CONFIG_S3_ACL=private
  #     - RCLONE_CONFIG_S3_ACCESS_KEY_ID=xxx
  #     - RCLONE_CONFIG_S3_SECRET_ACCESS_KEY=xxx
  #     - RCLONE_CONFIG_S3_ENDPOINT=https://storage.googleapis.com
  #     - RCLONE_CONFIG_S3_NO_CHECK_BUCKET=true

  frontend:
    build:
      context: ./frontend
    ports:
      - ${FRONTEND_PORT}:${FRONTEND_PORT}
    volumes:
      - ./frontend:/usr/src/app/frontend

  server:
    build:
      context: ./server
    environment:
      - FLASK_ENV=development
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
    depends_on:
      - postgres
      - rabbitmq
    volumes:
      - ./server:/usr/src/app/server
      - /usr/src/app/server/venv 

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: 'rabbitmq'
    ports:
        - 5672:5672
        - 15672:15672
    volumes:
        - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
        - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq

  postgres:
    image: postgres
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USERNAME}
      PGDATA: /var/lib/postgresql/data
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:

networks:
  onlyfans-net:
    driver: bridge